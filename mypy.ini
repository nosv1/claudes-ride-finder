# The coding standard's mypy settings (nosv1/nosv1 CODING.md, rule 10). Copy into the repo's mypy.ini
# or pyproject.toml ([tool.mypy]); add per-module ignore_missing_imports only for packages with no types.
[mypy]
strict = True
warn_unreachable = True
extra_checks = True
enable_error_code = possibly-undefined, redundant-expr, truthy-bool, truthy-iterable, ignore-without-code, unused-awaitable, redundant-self

[mypy-osmium.*]
ignore_missing_imports = True
