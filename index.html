<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ride Finder</title>
<meta name="description" content="Find curvy roads, fast sweepers and hills, and plan a motorcycle ride for the time you have. Missouri, Kansas and Texas.">
<!-- Link previews in texts and chats. A shared ride is in the link's #fragment, which previews never see, so every
     link shows this same card. The image is made by tools/make_preview.mjs; its URL has to be absolute. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Ride Finder">
<meta property="og:title" content="Ride Finder: motorcycle roads worth riding">
<meta property="og:description" content="Curvy roads, fast sweepers and hills. Plan a ride for the time you have, with the weather along the way.">
<meta property="og:url" content="https://nosv1.github.io/claudes-ride-finder/">
<meta property="og:image" content="https://nosv1.github.io/claudes-ride-finder/preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Ride Finder: curvy roads around Branson, Missouri, colored by how curvy they are">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.6.0/maplibre-gl.css">
<link rel="stylesheet" href="app.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.6.0/maplibre-gl.js"></script>
<script type="module" src="js/main.js"></script>
</head>
<body>
<div id="map"></div>

<header id="topbar" class="topbar">
  <div class="searchbox">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search roads, towns, places" autocomplete="off" spellcheck="false" aria-label="Search">
    <button id="qClear" class="icon-btn" title="Clear" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <div id="results" class="results" hidden></div>
  <nav id="chips" class="chips" aria-label="Filters"></nav>
  <div id="pickBanner" class="pick-banner" hidden></div>
</header>

<div class="fabs">
  <button id="locateBtn" class="fab" title="My location" aria-label="My location"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/></svg></button>
  <button id="tiltBtn" class="fab" title="3D terrain" aria-label="3D terrain"><b>3D</b></button>
  <button id="layersBtn" class="fab" title="Map layers" aria-label="Map layers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/></svg></button>
</div>

<section id="sheet" class="sheet" data-snap="half" aria-label="Ride Finder">
  <div id="grab" class="grab" title="Drag to resize"><span></span></div>
  <div id="sheetBody" class="sheet-body"></div>
</section>

<div id="menu" class="menu" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
