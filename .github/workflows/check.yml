# Runs on every push and pull request: lint (zero warnings), strict types for the JavaScript and Python, the
# baselines, and the logic tests. The coding standard: nosv1/nosv1 CODING.md (this repo's notes: CODING.md).
name: check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: pip install -r requirements-dev.txt
      - run: npm run check
      - run: node --test tests/app/logic.test.mjs
